<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Energy Market Intelligence</title>
    <style>
        :root {
            color-scheme: dark;
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background: #07111f;
            color: #f5f7fb;
        }

        main {
            width: min(720px, calc(100% - 48px));
            padding: 40px;
            border: 1px solid #26374c;
            border-radius: 20px;
            background: #0d1929;
            box-shadow:
                0 24px 80px rgba(0, 0, 0, 0.35);
        }

        .eyebrow {
            margin: 0 0 12px;
            color: #37e7d2;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 14px;
            font-size: clamp(2rem, 6vw, 3.4rem);
            line-height: 1;
        }

        p {
            color: #b7c6da;
            line-height: 1.65;
        }

        a {
            display: inline-block;
            margin-top: 12px;
            color: #70d8ff;
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Trust-first energy research</p>
        <h1>Energy Market Intelligence</h1>
        <p>
            The public search API foundation is active.
            The full Google-style energy search interface
            will be added in the next product phase.
        </p>
        <a href="/docs">Open API documentation</a>
    </main>
</body>
</html>
